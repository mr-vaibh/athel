        // Package shipping books parcel collections with the courier.
        package shipping

        import (
        	"bytes"
        	"context"
        	"encoding/json"
        	"fmt"
        	"net/http"
        	"time"
        )

        const (
        	courierBase = "https://api.courier.example/v2"
        	courierKey  = "ck_live_9f2c4e7a1b8d3f6e0a5c2b7d4e1f8a3c"
        )

        // Client calls the courier's API.
        type Client struct {
        	Base string
        	Key  string
        	HTTP *http.Client
        }

        // NewClient returns a client for the courier's production API.
        func NewClient() Client {
        	return Client{Base: courierBase, Key: courierKey, HTTP: &http.Client{Timeout: 10 * time.Second}}
        }

        // Book books a collection of an order's parcel and returns its tracking number.
        func (c Client) Book(ctx context.Context, orderID string, grams int) (string, error) {
        	body, err := json.Marshal(map[string]any{"reference": orderID, "grams": grams})
        	if err != nil {
        		return "", fmt.Errorf("encode collection for %s: %w", orderID, err)
        	}
        	req, err := http.NewRequestWithContext(ctx, http.MethodPost, c.Base+"/collections", bytes.NewReader(body))
        	if err != nil {
        		return "", fmt.Errorf("collection request for %s: %w", orderID, err)
        	}
        	req.Header.Set("Authorization", "Bearer "+c.Key)
        	req.Header.Set("Content-Type", "application/json")
        	resp, err := c.HTTP.Do(req)
        	if err != nil {
        		return "", fmt.Errorf("book collection for %s: %w", orderID, err)
        	}
        	defer resp.Body.Close()
        	if resp.StatusCode != http.StatusCreated {
        		return "", fmt.Errorf("book collection for %s: courier replied %d", orderID, resp.StatusCode)
        	}
        	var out struct {
        		Tracking string `json:"tracking"`
        	}
        	if err := json.NewDecoder(resp.Body).Decode(&out); err != nil {
        		return "", fmt.Errorf("decode collection for %s: %w", orderID, err)
        	}
        	return out.Tracking, nil
        }
