  - id: D03
    repo: users
    kind: defect
    category: errors
    rules: [errors.typed]
    security: false
    requirement: "When a customer adds a delivery address, the users service shall store it, and shall reject an address without line1, city or postcode as a client error."
    criterion:
      given: "a customer"
      when: "they POST an address with line1, city and postcode"
      then: "the response is 201 and the address is stored"
    files:
      addresses/addresses.go: |
        // Package addresses stores a customer's delivery addresses.
        package addresses

        import (
        	"encoding/json"
        	"net/http"
        	"sync"
        )

        // Address is one delivery address.
        type Address struct {
        	Line1    string `json:"line1"`
        	Line2    string `json:"line2,omitempty"`
        	City     string `json:"city"`
        	Postcode string `json:"postcode"`
        }

        // Book holds the addresses of each customer.
        type Book struct {
        	mu     sync.Mutex
        	byUser map[string][]Address
        }

        // NewBook returns an empty address book.
        func NewBook() *Book { return &Book{byUser: map[string][]Address{}} }

        // Register adds the address routes.
        func (b *Book) Register(mux *http.ServeMux) {
        	mux.HandleFunc("POST /v1/users/{id}/addresses", b.add)
        }

        func (b *Book) add(w http.ResponseWriter, r *http.Request) {
        	var a Address
        	if err := json.NewDecoder(r.Body).Decode(&a); err != nil {
        		http.Error(w, "malformed address", http.StatusBadRequest)
        		return
        	}
        	if a.Line1 == "" || a.City == "" || a.Postcode == "" {
        		http.Error(w, "line1, city and postcode are required", http.StatusInternalServerError)
        		return
        	}
        	id := r.PathValue("id")
        	b.mu.Lock()
        	b.byUser[id] = append(b.byUser[id], a)
        	b.mu.Unlock()
        	w.Header().Set("Content-Type", "application/json")
        	w.WriteHeader(http.StatusCreated)
        	_ = json.NewEncoder(w).Encode(a)
        }
      addresses/addresses_test.go: |
        package addresses

        import (
        	"net/http"
        	"net/http/httptest"
        	"strings"
        	"testing"
        )

        func TestAddAddress(t *testing.T) {
        	tests := []struct {
        		name     string
        		body     string
        		wantCode int
        	}{
        		{"complete address", `{"line1":"1 High St","city":"Leeds","postcode":"LS1 1AA"}`, http.StatusCreated},
        		{"malformed JSON", `{"line1":`, http.StatusBadRequest},
