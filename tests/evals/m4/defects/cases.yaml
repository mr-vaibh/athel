        	tests := []struct {
        		name       string
        		deliveries []string
        		want       int64
        		wantErr    bool
        	}{
        		{"paid order", []string{paid}, 25, false},
        		{"redelivered", []string{paid, paid}, 25, false},
        		{"two orders", []string{paid, `{"order_id":"o-2","customer_id":"c-1","pence":1000}`}, 35, false},
        		{"malformed", []string{`{"order_id":`}, 0, true},
        		{"no customer", []string{`{"order_id":"o-1","pence":2599}`}, 0, true},
        		{"negative amount", []string{`{"order_id":"o-1","customer_id":"c-1","pence":-5}`}, 0, true},
        	}
        	for _, tt := range tests {
        		t.Run(tt.name, func(t *testing.T) {
        			p := NewPoints()
        			var err error
        			for _, d := range tt.deliveries {
        				err = p.Handle([]byte(d))
