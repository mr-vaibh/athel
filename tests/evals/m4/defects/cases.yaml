      when: "orders computes its ship date"
      then: "the ship date is that day"
    files:
      delivery/delivery.go: |
        // Package delivery decides the day an order leaves the warehouse.
        package delivery

        import "time"

        // CutoffHour is the hour, in UTC, from which new orders ship the next day.
        const CutoffHour = 14

        // Planner computes ship dates against an injected clock.
        type Planner struct{ Now func() time.Time }

        // ShipDate returns midnight of the day an order placed now is shipped.
        func (p Planner) ShipDate() time.Time {
        	now := p.Now()
        	today := time.Date(now.Year(), now.Month(), now.Day(), 0, 0, 0, 0, time.Local)
        	cutoff := today.Add(CutoffHour * time.Hour)
        	if now.Before(cutoff) {
        		return today
        	}
        	return today.AddDate(0, 0, 1)
        }
