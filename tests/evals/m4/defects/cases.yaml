    files:
      sessions/sessions.go: |
        // Package sessions keeps signed-in sessions for a fixed lifetime.
        package sessions

        import (
        	"sync"
        	"time"
        )

        // Store maps session tokens to their expiry.
        type Store struct {
        	mu      sync.Mutex
        	ttl     time.Duration
        	expires map[string]time.Time
        }

        // New returns a store whose sessions last ttl.
        func New(ttl time.Duration) *Store {
        	return &Store{ttl: ttl, expires: map[string]time.Time{}}
        }

        // Start opens a session for token.
        func (s *Store) Start(token string) {
        	s.mu.Lock()
        	defer s.mu.Unlock()
        	s.expires[token] = time.Now().Add(s.ttl)
        }

        // Valid reports whether token is a session that has not expired.
        func (s *Store) Valid(token string) bool {
        	s.mu.Lock()
        	defer s.mu.Unlock()
        	exp, ok := s.expires[token]
        	return ok && time.Now().Before(exp)
        }
