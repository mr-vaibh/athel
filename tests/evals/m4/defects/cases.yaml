  - id: D07
    repo: users
    kind: defect
    category: observability
    rules: [observability.no-pii]
    security: true
    requirement: "When a customer asks to verify their phone number, the users service shall text them a one-time code."
    criterion:
      given: "a signed-in customer"
      when: "they POST their phone number to /v1/users/{id}/phone/verify"
      then: "a code is sent to that number and the response is 202"
    files:
      verification/verification.go: |
        // Package verification sends one-time codes that confirm a customer's phone number.
        package verification

        import (
        	"context"
        	"encoding/json"
        	"log"
        	"net/http"
        )

        // Sender delivers a text message.
        type Sender interface {
        	Send(ctx context.Context, phone, text string) error
        }

        // Pending remembers the code each customer must enter.
        type Pending interface {
        	Put(userID, code string)
        }

        // Handler serves POST /v1/users/{id}/phone/verify.
        type Handler struct {
        	Sender  Sender
        	Pending Pending
        	Code    func() string
        }

        // Register adds the verification route.
        func (h Handler) Register(mux *http.ServeMux) {
        	mux.HandleFunc("POST /v1/users/{id}/phone/verify", h.start)
        }

        func (h Handler) start(w http.ResponseWriter, r *http.Request) {
        	var in struct {
        		Phone string `json:"phone"`
        	}
        	if err := json.NewDecoder(r.Body).Decode(&in); err != nil || in.Phone == "" {
        		http.Error(w, "phone is required", http.StatusBadRequest)
        		return
        	}
        	id, code := r.PathValue("id"), h.Code()
        	log.Printf("sending verification code to %s for user %s", in.Phone, id)
        	if err := h.Sender.Send(r.Context(), in.Phone, "Your shop code is "+code); err != nil {
        		log.Printf("verification for user %s: %v", id, err)
        		http.Error(w, "could not send the code", http.StatusBadGateway)
        		return
        	}
        	h.Pending.Put(id, code)
        	w.WriteHeader(http.StatusAccepted)
        }
      verification/verification_test.go: |
        package verification

        import (
        	"context"
        	"errors"
        	"net/http"
        	"net/http/httptest"
        	"strings"
        	"testing"
        )

        type fakeSender struct{ err error }

        func (f fakeSender) Send(context.Context, string, string) error { return f.err }

        type fakePending map[string]string

        func (f fakePending) Put(userID, code string) { f[userID] = code }

        func TestStartVerification(t *testing.T) {
        	tests := []struct {
        		name        string
        		body        string
        		sendErr     error
        		wantCode    int
        		wantPending bool
        	}{
        		{"code sent", `{"phone":"+44 20 7946 0000"}`, nil, http.StatusAccepted, true},
        		{"no phone", `{}`, nil, http.StatusBadRequest, false},
        		{"sender down", `{"phone":"+44 20 7946 0000"}`, errors.New("timeout"), http.StatusBadGateway, false},
        	}
        	for _, tt := range tests {
        		t.Run(tt.name, func(t *testing.T) {
        			pending := fakePending{}
        			mux := http.NewServeMux()
        			Handler{Sender: fakeSender{tt.sendErr}, Pending: pending, Code: func() string { return "123456" }}.Register(mux)
        			rec := httptest.NewRecorder()
        			mux.ServeHTTP(rec, httptest.NewRequest(http.MethodPost, "/v1/users/u-1/phone/verify", strings.NewReader(tt.body)))
        			if rec.Code != tt.wantCode || (pending["u-1"] == "123456") != tt.wantPending {
        				t.Fatalf("status %d, pending %v", rec.Code, pending)
        			}
        		})
        	}
        }
