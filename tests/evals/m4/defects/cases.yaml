# M4 reviewer eval corpus (EC-2): each case is applied alone to a fresh copy of its fixture repo.
cases:
  - id: D01
    repo: users
    kind: defect
    category: errors
    rules: [errors.no-silent-catch]
    security: false
    requirement: "When a customer asks for their notification preferences, the users service shall return the saved preferences, or the defaults if the customer has never saved any."
    criterion:
      given: "a customer who has never saved preferences"
      when: "they request GET /v1/users/{id}/preferences"
      then: "the response is 200 with the default preferences"
    files:
      preferences/preferences.go: |
        // Package preferences serves the channels a customer accepts notifications on.
        package preferences

        import (
        	"context"
        	"encoding/json"
        	"errors"
        	"net/http"
        )

        // Preferences are the channels a customer accepts notifications on.
        type Preferences struct {
        	Email bool `json:"email"`
        	SMS   bool `json:"sms"`
        	Push  bool `json:"push"`
        }

        // ErrNotFound means the customer has never saved preferences.
        var ErrNotFound = errors.New("preferences not found")

        // Store reads saved preferences.
        type Store interface {
        	Get(ctx context.Context, userID string) (Preferences, error)
        }

        // Defaults are the preferences of a customer who has not chosen any.
        func Defaults() Preferences { return Preferences{Email: true} }

        // Handler serves GET /v1/users/{id}/preferences.
        type Handler struct{ Store Store }

        // Register adds the preferences route.
        func (h Handler) Register(mux *http.ServeMux) {
        	mux.HandleFunc("GET /v1/users/{id}/preferences", h.get)
        }

        func (h Handler) get(w http.ResponseWriter, r *http.Request) {
        	w.Header().Set("Content-Type", "application/json")
        	_ = json.NewEncoder(w).Encode(h.load(r.Context(), r.PathValue("id")))
        }

        // load returns the customer's saved preferences, or the defaults for a new customer.
        func (h Handler) load(ctx context.Context, userID string) Preferences {
        	p, err := h.Store.Get(ctx, userID)
        	if err != nil {
        		return Defaults()
        	}
        	return p
        }
      preferences/preferences_test.go: |
        package preferences

        import (
        	"context"
        	"encoding/json"
        	"net/http"
        	"net/http/httptest"
        	"testing"
        )

        type fakeStore map[string]Preferences

        func (f fakeStore) Get(_ context.Context, userID string) (Preferences, error) {
        	p, ok := f[userID]
        	if !ok {
        		return Preferences{}, ErrNotFound
        	}
        	return p, nil
        }

        func TestGetPreferences(t *testing.T) {
        	tests := []struct {
        		name string
        		id   string
        		want Preferences
        	}{
        		{"saved preferences", "u-1", Preferences{SMS: true, Push: true}},
        		{"never saved", "u-2", Defaults()},
        	}
        	for _, tt := range tests {
        		t.Run(tt.name, func(t *testing.T) {
        			mux := http.NewServeMux()
        			Handler{Store: fakeStore{"u-1": {SMS: true, Push: true}}}.Register(mux)
        			rec := httptest.NewRecorder()
        			mux.ServeHTTP(rec, httptest.NewRequest(http.MethodGet, "/v1/users/"+tt.id+"/preferences", nil))
        			var got Preferences
        			if err := json.NewDecoder(rec.Body).Decode(&got); err != nil || rec.Code != http.StatusOK || got != tt.want {
        				t.Fatalf("status %d, got %+v, %v", rec.Code, got, err)
        			}
        		})
        	}
        }
    planted:
      file: preferences/preferences.go
      lines: [44, 48]
  - id: D02
    repo: orders
    kind: defect
    category: errors
    rules: [errors.no-magic-return, errors.typed]
    security: false
    requirement: "When the orders service checks stock, it shall read the units held from the warehouse service."
    criterion:
      given: "the warehouse holds 7 units of mug-blue"
      when: "orders checks whether 7 units are in stock"
      then: "the check reports they are in stock"
    files:
      inventory/inventory.go: |
        // Package inventory reads stock levels from the warehouse service.
        package inventory

        import (
        	"context"
        	"encoding/json"
        	"net/http"
        	"net/url"
        )

        // Client calls the warehouse service.
        type Client struct {
        	Base string
        	HTTP *http.Client
        }

        // Units returns how many units of sku the warehouse holds.
        func (c Client) Units(ctx context.Context, sku string) int {
        	req, err := http.NewRequestWithContext(ctx, http.MethodGet, c.Base+"/v1/stock/"+url.PathEscape(sku), nil)
        	if err != nil {
        		return -1
        	}
        	resp, err := c.HTTP.Do(req)
        	if err != nil {
        		return -1
        	}
        	defer resp.Body.Close()
        	if resp.StatusCode != http.StatusOK {
        		return -1
        	}
        	var body struct {
        		Units int `json:"units"`
        	}
        	if err := json.NewDecoder(resp.Body).Decode(&body); err != nil {
        		return -1
        	}
        	return body.Units
        }

        // InStock reports whether at least qty units of sku can be sold.
        func (c Client) InStock(ctx context.Context, sku string, qty int) bool {
        	return c.Units(ctx, sku) >= qty
        }
      inventory/inventory_test.go: |
        package inventory

        import (
        	"context"
        	"net/http"
        	"net/http/httptest"
        	"testing"
        )

        func warehouse(t *testing.T) *httptest.Server {
        	t.Helper()
        	srv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
        		if r.URL.Path != "/v1/stock/mug-blue" {
        			http.NotFound(w, r)
        			return
        		}
        		_, _ = w.Write([]byte(`{"units":7}`))
        	}))
        	t.Cleanup(srv.Close)
        	return srv
        }

        func TestInStock(t *testing.T) {
        	srv := warehouse(t)
        	c := Client{Base: srv.URL, HTTP: srv.Client()}
        	tests := []struct {
        		name string
        		sku  string
        		qty  int
        		want bool
        	}{
        		{"enough units", "mug-blue", 7, true},
        		{"too few units", "mug-blue", 8, false},
        	}
        	for _, tt := range tests {
        		t.Run(tt.name, func(t *testing.T) {
        			if got := c.InStock(context.Background(), tt.sku, tt.qty); got != tt.want {
        				t.Fatalf("InStock(%s, %d) = %v, want %v", tt.sku, tt.qty, got, tt.want)
        			}
        		})
        	}
        }
