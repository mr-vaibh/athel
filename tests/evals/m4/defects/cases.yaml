        // Package events publishes users.updated.v1.
        package events

        import (
        	"encoding/json"
        	"log"
        )

        // Topic is the event every phone or name change is announced on.
        const Topic = "users.updated.v1"

        // Event is the users.updated.v1 message body.
        type Event struct {
        	UserID   string `json:"user_id"`
        	HasPhone bool   `json:"has_phone"`
        }

        // PublishUserUpdated announces a changed user.
        func PublishUserUpdated(id, phone string) {
        	body, err := json.Marshal(Event{UserID: id, HasPhone: phone != ""})
        	if err != nil {
        		log.Printf("publish %s id=%s: encode: %v", Topic, id, err)
        		return
        	}
        	log.Printf("publish %s %s", Topic, body)
        }
