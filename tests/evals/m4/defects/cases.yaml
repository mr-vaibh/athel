  - id: D06
    repo: users
    kind: defect
    category: security
    rules: [security.parameterised-queries, security.input-validation]
    security: true
    requirement: "When a support agent searches by name, the users service shall return up to 20 customers whose name contains the term."
    criterion:
      given: "customers named Ada and Bob"
      when: "support searches for \"ada\""
      then: "the response lists Ada"
    files:
      search/search.go: |
        // Package search finds customers by name for the support console.
        package search

        import (
        	"context"
        	"database/sql"
        	"encoding/json"
        	"fmt"
        	"log"
        	"net/http"
        )

        // Match is one customer found by a search.
        type Match struct {
        	ID   string `json:"id"`
        	Name string `json:"name"`
        }

        // Finder finds customers whose name contains a term.
        type Finder interface {
        	ByName(ctx context.Context, term string) ([]Match, error)
        }

        // Store finds customers in the users table.
        type Store struct{ DB *sql.DB }

        // ByName returns up to 20 customers whose name contains term, ignoring case.
        func (s Store) ByName(ctx context.Context, term string) ([]Match, error) {
        	query := "SELECT id, name FROM users WHERE name ILIKE '%" + term + "%' ORDER BY name LIMIT 20"
        	rows, err := s.DB.QueryContext(ctx, query)
        	if err != nil {
        		return nil, fmt.Errorf("search users: %w", err)
        	}
        	defer rows.Close()
        	var out []Match
        	for rows.Next() {
        		var m Match
        		if err := rows.Scan(&m.ID, &m.Name); err != nil {
        			return nil, fmt.Errorf("scan user: %w", err)
        		}
        		out = append(out, m)
        	}
        	return out, rows.Err()
        }

        // Handler serves GET /v1/users/search?name=.
        type Handler struct{ Finder Finder }

        func (h Handler) ServeHTTP(w http.ResponseWriter, r *http.Request) {
        	term := r.URL.Query().Get("name")
        	if term == "" {
        		http.Error(w, "name is required", http.StatusBadRequest)
        		return
        	}
        	matches, err := h.Finder.ByName(r.Context(), term)
        	if err != nil {
        		log.Printf("user search: %v", err)
        		http.Error(w, "search failed", http.StatusInternalServerError)
        		return
        	}
        	w.Header().Set("Content-Type", "application/json")
        	_ = json.NewEncoder(w).Encode(matches)
        }
      search/search_test.go: |
        package search

        import (
        	"context"
        	"errors"
        	"net/http"
        	"net/http/httptest"
        	"testing"
        )

        type fakeFinder struct {
        	matches []Match
        	err     error
        }

        func (f fakeFinder) ByName(context.Context, string) ([]Match, error) { return f.matches, f.err }

        func TestSearch(t *testing.T) {
        	tests := []struct {
        		name     string
