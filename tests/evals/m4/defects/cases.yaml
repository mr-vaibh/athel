  - id: D04
    repo: orders
    kind: defect
    category: errors
    rules: [errors.path-tested, tests.failure-paths]
    security: false
    requirement: "When support refunds an order, the orders service shall record the refund unless the order's refunds would exceed the amount paid."
    criterion:
      given: "an order paid at 1000 pence"
      when: "support refunds 400 pence"
      then: "the response is 201 and the refund is recorded"
    files:
      refunds/refunds.go: |
        // Package refunds records refunds against paid orders.
        package refunds

        import (
        	"encoding/json"
        	"errors"
        	"net/http"
        	"sync"
        )

        // Refund is money returned to the customer for one order.
        type Refund struct {
        	OrderID string `json:"order_id"`
        	Pence   int64  `json:"pence"`
        }

        // ErrExceedsPaid means the refunds would return more than the customer paid.
        var ErrExceedsPaid = errors.New("refund exceeds the amount paid")

        // Ledger tracks how much of each order was paid and refunded.
        type Ledger struct {
        	mu       sync.Mutex
        	paid     map[string]int64
        	refunded map[string]int64
        }

        // NewLedger returns a ledger of the given paid amounts, in pence per order.
        func NewLedger(paid map[string]int64) *Ledger {
        	return &Ledger{paid: paid, refunded: map[string]int64{}}
        }

        // Refund records r unless the order's refunds would exceed what was paid.
        func (l *Ledger) Refund(r Refund) error {
        	l.mu.Lock()
        	defer l.mu.Unlock()
        	if l.refunded[r.OrderID]+r.Pence > l.paid[r.OrderID] {
        		return ErrExceedsPaid
        	}
        	l.refunded[r.OrderID] += r.Pence
        	return nil
        }

        // Register adds the refund route.
        func (l *Ledger) Register(mux *http.ServeMux) {
        	mux.HandleFunc("POST /v1/orders/{id}/refunds", l.create)
        }

        func (l *Ledger) create(w http.ResponseWriter, r *http.Request) {
        	var in Refund
        	if err := json.NewDecoder(r.Body).Decode(&in); err != nil || in.Pence <= 0 {
        		http.Error(w, "pence must be a positive amount", http.StatusBadRequest)
        		return
        	}
        	in.OrderID = r.PathValue("id")
        	if err := l.Refund(in); err != nil {
        		http.Error(w, err.Error(), http.StatusUnprocessableEntity)
        		return
        	}
        	w.Header().Set("Content-Type", "application/json")
        	w.WriteHeader(http.StatusCreated)
        	_ = json.NewEncoder(w).Encode(in)
        }
      refunds/refunds_test.go: |
        package refunds

        import (
        	"encoding/json"
        	"net/http"
        	"net/http/httptest"
        	"strings"
        	"testing"
        )

        func TestCreateRefund(t *testing.T) {
        	mux := http.NewServeMux()
        	NewLedger(map[string]int64{"o-1": 1000}).Register(mux)
        	rec := httptest.NewRecorder()
        	mux.ServeHTTP(rec, httptest.NewRequest(http.MethodPost, "/v1/orders/o-1/refunds", strings.NewReader(`{"pence":400}`)))
