        // Package coupons issues single-use discount codes.
        package coupons

        import (
        	"errors"
        	"fmt"
        	"sync"
        )

        var (
        	// ErrUnknown means no coupon has the code.
        	ErrUnknown = errors.New("unknown coupon")
        	// ErrRedeemed means the coupon was already used.
        	ErrRedeemed = errors.New("coupon already redeemed")
        )

        type coupon struct {
        	percent  int
        	redeemed bool
        }

        // Book holds issued coupons.
        type Book struct {
        	mu      sync.Mutex
        	coupons map[string]*coupon
        }

        // NewBook returns a book with no coupons.
        func NewBook() *Book { return &Book{coupons: map[string]*coupon{}} }

        // Create issues code for a discount of percent, from 1 to 100.
        func (b *Book) Create(code string, percent int) error {
        	if code == "" || percent < 1 || percent > 100 {
        		return fmt.Errorf("coupon %q: a code and a percent from 1 to 100 are required", code)
        	}
        	b.mu.Lock()
        	defer b.mu.Unlock()
        	b.coupons[code] = &coupon{percent: percent}
        	return nil
        }

        // Redeem uses code once and returns its discount.
        func (b *Book) Redeem(code string) (int, error) {
