    files:
      stock/stock.go: |
        // Package stock reads stock levels from the warehouse service.
        package stock

        import (
        	"context"
        	"encoding/json"
        	"errors"
        	"fmt"
        	"net/http"
        	"net/url"
        	"time"
        )

        // ErrUnknownSKU means the warehouse does not stock the product.
        var ErrUnknownSKU = errors.New("unknown sku")

        // StatusError is a reply the client does not expect from the warehouse.
        type StatusError struct{ Code int }

        func (e *StatusError) Error() string { return fmt.Sprintf("warehouse replied %d", e.Code) }

        // Client calls the warehouse service.
        type Client struct {
        	Base string
        	HTTP *http.Client
        }

        // NewClient returns a client that gives up on a call after five seconds.
        func NewClient(base string) Client {
        	return Client{Base: base, HTTP: &http.Client{Timeout: 5 * time.Second}}
        }

        // Units returns how many units of sku the warehouse holds.
        func (c Client) Units(ctx context.Context, sku string) (int, error) {
        	req, err := http.NewRequestWithContext(ctx, http.MethodGet, c.Base+"/v1/stock/"+url.PathEscape(sku), nil)
        	if err != nil {
        		return 0, fmt.Errorf("stock request for %s: %w", sku, err)
        	}
        	resp, err := c.HTTP.Do(req)
        	if err != nil {
        		return 0, fmt.Errorf("stock for %s: %w", sku, err)
        	}
        	defer resp.Body.Close()
        	switch resp.StatusCode {
        	case http.StatusOK:
        	case http.StatusNotFound:
        		return 0, fmt.Errorf("stock for %s: %w", sku, ErrUnknownSKU)
        	default:
        		return 0, fmt.Errorf("stock for %s: %w", sku, &StatusError{Code: resp.StatusCode})
        	}
        	var body struct {
        		Units int `json:"units"`
        	}
        	if err := json.NewDecoder(resp.Body).Decode(&body); err != nil {
        		return 0, fmt.Errorf("decode stock for %s: %w", sku, err)
        	}
        	return body.Units, nil
        }
