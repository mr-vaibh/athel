        	"log"
        	"net/http"
        )

        // ErrNotFound means no account has the ID.
        var ErrNotFound = errors.New("account not found")

        // Account is a customer's account summary.
        type Account struct {
        	ID     string `json:"id"`
        	Status string `json:"status"`
        }

