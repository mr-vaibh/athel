        func TestSessionExpires(t *testing.T) {
        	s := New(10 * time.Millisecond)
        	s.Start("tok-1")
        	if !s.Valid("tok-1") {
        		t.Fatal("new session is not valid")
        	}
        	time.Sleep(20 * time.Millisecond)
