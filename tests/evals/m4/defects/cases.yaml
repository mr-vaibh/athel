        		finder   fakeFinder
        		wantCode int
        	}{
        		{"matches", "?name=ada", fakeFinder{matches: []Match{{ID: "u-1", Name: "Ada"}}}, http.StatusOK},
        		{"no name", "", fakeFinder{}, http.StatusBadRequest},
        		{"store fails", "?name=ada", fakeFinder{err: errors.New("connection reset")}, http.StatusInternalServerError},
        	}
        	for _, tt := range tests {
        		t.Run(tt.name, func(t *testing.T) {
        			rec := httptest.NewRecorder()
        			Handler{Finder: tt.finder}.ServeHTTP(rec, httptest.NewRequest(http.MethodGet, "/v1/users/search"+tt.query, nil))
        			if rec.Code != tt.wantCode {
        				t.Fatalf("status %d, want %d", rec.Code, tt.wantCode)
        			}
        		})
        	}
        }
