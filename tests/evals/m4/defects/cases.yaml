        // Package quotes prices a basket with delivery before checkout.
        package quotes

        import (
        	"encoding/json"
        	"errors"
        	"fmt"
        	"net/http"
        )

        // Request is a basket to price.
        type Request struct {
        	Zone  string         `json:"zone"`
        	Items map[string]int `json:"items"`
        }

        // Quote is the priced basket.
        type Quote struct {
        	GoodsPence    int64 `json:"goods_pence"`
        	DeliveryPence int64 `json:"delivery_pence"`
        }

        // ErrUnpriceable means the basket names an unknown zone or product, or a quantity below 1.
        var ErrUnpriceable = errors.New("basket cannot be priced")

        // Quoter serves POST /v1/quotes from fixed price lists.
        type Quoter struct {
        	Prices   map[string]int64
        	Delivery map[string]int64
        }

        func (q Quoter) ServeHTTP(w http.ResponseWriter, r *http.Request) {
        	var in Request
        	if err := json.NewDecoder(r.Body).Decode(&in); err != nil || len(in.Items) == 0 {
        		http.Error(w, "a basket with at least one item is required", http.StatusBadRequest)
        		return
        	}
        	fmt.Println("quote request:", in)
        	out, err := q.price(in)
        	if err != nil {
        		http.Error(w, err.Error(), http.StatusUnprocessableEntity)
        		return
        	}
        	fmt.Printf("quote result: %+v\n", out)
        	w.Header().Set("Content-Type", "application/json")
        	_ = json.NewEncoder(w).Encode(out)
        }

        func (q Quoter) price(in Request) (Quote, error) {
        	delivery, ok := q.Delivery[in.Zone]
        	if !ok {
        		return Quote{}, fmt.Errorf("zone %q: %w", in.Zone, ErrUnpriceable)
        	}
        	out := Quote{DeliveryPence: delivery}
        	for sku, qty := range in.Items {
        		price, ok := q.Prices[sku]
        		if !ok || qty < 1 {
        			return Quote{}, fmt.Errorf("product %q, quantity %d: %w", sku, qty, ErrUnpriceable)
        		}
        		out.GoodsPence += price * int64(qty)
        	}
        	return out, nil
        }
