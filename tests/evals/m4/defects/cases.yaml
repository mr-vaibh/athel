    category: reliability
    rules: []
    security: false
    requirement: "When an order is paid, the orders service shall award the customer one loyalty point per whole pound, once per order."
    criterion:
      given: "a customer with no points"
      when: "orders.paid.v1 for an order of 2599 pence is delivered twice"
      then: "the customer has 25 points"
    files:
      rewards/rewards.go: |
        // Package rewards awards points when an order is paid.
        package rewards

        import (
        	"encoding/json"
        	"fmt"
        	"sync"
        )

        // Paid is the orders.paid.v1 message.
        type Paid struct {
        	OrderID    string `json:"order_id"`
        	CustomerID string `json:"customer_id"`
        	Pence      int64  `json:"pence"`
        }

        // Points holds each customer's balance, one point per whole pound paid, and the orders
        // already counted, so a redelivered message awards nothing.
        type Points struct {
        	mu      sync.Mutex
        	balance map[string]int64
        	counted map[string]bool
        }

        // NewPoints returns empty balances.
        func NewPoints() *Points {
        	return &Points{balance: map[string]int64{}, counted: map[string]bool{}}
        }

        // Handle consumes one orders.paid.v1 delivery; the queue delivers at least once.
        func (p *Points) Handle(body []byte) error {
        	var m Paid
        	if err := json.Unmarshal(body, &m); err != nil {
        		return fmt.Errorf("decode orders.paid.v1: %w", err)
        	}
        	if m.OrderID == "" || m.CustomerID == "" || m.Pence < 0 {
        		return fmt.Errorf("orders.paid.v1 %q: order, customer and a non-negative amount are required", m.OrderID)
        	}
        	p.mu.Lock()
        	defer p.mu.Unlock()
        	if p.counted[m.OrderID] {
        		return nil
        	}
        	p.counted[m.OrderID] = true
        	p.balance[m.CustomerID] += m.Pence / 100
        	return nil
        }

        // Balance returns a customer's points.
        func (p *Points) Balance(customerID string) int64 {
        	p.mu.Lock()
        	defer p.mu.Unlock()
        	return p.balance[customerID]
        }
