        	}
        	for _, tt := range tests {
        		t.Run(tt.name, func(t *testing.T) {
        			rec := httptest.NewRecorder()
        			List{Products: tt.products}.ServeHTTP(rec, httptest.NewRequest(http.MethodGet, "/v1/products"+tt.query, nil))
        			if rec.Code != tt.wantCode {
        				t.Fatalf("status %d, want %d", rec.Code, tt.wantCode)
        			}
        			var page []Product
        			if tt.wantCode == http.StatusOK && (json.NewDecoder(rec.Body).Decode(&page) != nil || len(page) != tt.wantLen) {
        				t.Fatalf("page of %d, want %d", len(page), tt.wantLen)
        			}
        		})
        	}
        }
