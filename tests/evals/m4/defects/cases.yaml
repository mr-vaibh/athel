        // Package invoices builds the invoice list of a customer.
        package invoices

        import (
        	"context"
        	"database/sql"
        	"fmt"
        )

        // Line is one charged item of an invoice.
        type Line struct {
        	SKU   string
        	Pence int64
        }

        // Invoice is one order's lines and total.
        type Invoice struct {
        	OrderID    string
        	Lines      []Line
        	TotalPence int64
        }

        // NewInvoice totals the lines of an order.
        func NewInvoice(orderID string, lines []Line) Invoice {
        	inv := Invoice{OrderID: orderID, Lines: lines}
        	for _, l := range lines {
        		inv.TotalPence += l.Pence
        	}
        	return inv
        }

        // Store reads orders and their lines.
        type Store struct{ DB *sql.DB }

        // ForCustomer returns every invoice of a customer, newest first.
        func (s Store) ForCustomer(ctx context.Context, customerID string) ([]Invoice, error) {
        	ids, err := s.orderIDs(ctx, customerID)
        	if err != nil {
        		return nil, err
        	}
        	out := make([]Invoice, 0, len(ids))
        	for _, id := range ids {
        		lines, err := s.lines(ctx, id)
        		if err != nil {
        			return nil, err
        		}
        		out = append(out, NewInvoice(id, lines))
        	}
        	return out, nil
        }

        func (s Store) orderIDs(ctx context.Context, customerID string) ([]string, error) {
        	rows, err := s.DB.QueryContext(ctx, "SELECT id FROM orders WHERE customer_id = $1 ORDER BY created_at DESC", customerID)
        	if err != nil {
        		return nil, fmt.Errorf("orders of %s: %w", customerID, err)
        	}
        	defer rows.Close()
        	var ids []string
        	for rows.Next() {
        		var id string
        		if err := rows.Scan(&id); err != nil {
        			return nil, fmt.Errorf("scan order: %w", err)
        		}
        		ids = append(ids, id)
        	}
        	return ids, rows.Err()
        }

        func (s Store) lines(ctx context.Context, orderID string) ([]Line, error) {
        	rows, err := s.DB.QueryContext(ctx, "SELECT sku, pence FROM order_lines WHERE order_id = $1", orderID)
        	if err != nil {
        		return nil, fmt.Errorf("lines of %s: %w", orderID, err)
        	}
        	defer rows.Close()
        	var out []Line
        	for rows.Next() {
        		var l Line
        		if err := rows.Scan(&l.SKU, &l.Pence); err != nil {
        			return nil, fmt.Errorf("scan line: %w", err)
        		}
        		out = append(out, l)
        	}
        	return out, rows.Err()
        }
