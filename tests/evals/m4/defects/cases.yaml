        	if err := json.NewDecoder(rec.Body).Decode(&got); err != nil || rec.Code != http.StatusCreated {
        		t.Fatalf("status %d, %v", rec.Code, err)
        	}
        	if got != (Refund{OrderID: "o-1", Pence: 400}) {
        		t.Fatalf("got %+v", got)
        	}
        }
