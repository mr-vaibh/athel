        package stock

        import (
        	"context"
        	"errors"
        	"net/http"
        	"net/http/httptest"
        	"testing"
        	"time"
        )

        func TestNewClientHasATimeout(t *testing.T) {
        	if c := NewClient("http://warehouse"); c.HTTP.Timeout != 5*time.Second || c.Base != "http://warehouse" {
        		t.Fatalf("got %+v", c)
        	}
        }

        func TestUnits(t *testing.T) {
        	tests := []struct {
        		name   string
        		status int
        		body   string
        		want   int
        		check  func(error) bool
        	}{
        		{"in stock", http.StatusOK, `{"units":7}`, 7, func(err error) bool { return err == nil }},
        		{"unknown sku", http.StatusNotFound, ``, 0, func(err error) bool { return errors.Is(err, ErrUnknownSKU) }},
        		{"warehouse fails", http.StatusBadGateway, ``, 0, func(err error) bool {
        			var se *StatusError
        			return errors.As(err, &se) && se.Code == http.StatusBadGateway
        		}},
        		{"malformed reply", http.StatusOK, `{"units":`, 0, func(err error) bool { return err != nil }},
        	}
        	for _, tt := range tests {
        		t.Run(tt.name, func(t *testing.T) {
        			srv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
        				w.WriteHeader(tt.status)
        				_, _ = w.Write([]byte(tt.body))
        			}))
        			t.Cleanup(srv.Close)
        			got, err := Client{Base: srv.URL, HTTP: srv.Client()}.Units(context.Background(), "mug-blue")
        			if got != tt.want || !tt.check(err) {
        				t.Fatalf("Units = %d, %v", got, err)
        			}
        		})
        	}
