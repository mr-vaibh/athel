      products/products.go: |
        // Package products lists the products on sale, a page at a time.
        package products

        import (
        	"encoding/json"
        	"net/http"
        	"strconv"
        )

        const (
        	// DefaultPageSize is the page size when the client does not ask for one.
        	DefaultPageSize = 20
        	// MaxPageSize is the largest page a client may ask for.
        	MaxPageSize = 100
        )

        // Product is one product on sale.
        type Product struct {
        	SKU   string `json:"sku"`
        	Name  string `json:"name"`
        	Pence int64  `json:"pence"`
        }

        // List serves GET /v1/products?size= from a fixed product list.
        type List struct{ Products []Product }

        func (l List) ServeHTTP(w http.ResponseWriter, r *http.Request) {
        	size := DefaultPageSize
        	if v := r.URL.Query().Get("size"); v != "" {
        		n, err := strconv.Atoi(v)
        		if err != nil || n < 1 || n > MaxPageSize {
        			http.Error(w, "size must be from 1 to 100", http.StatusBadRequest)
        			return
        		}
        		size = n
        	}
        	page := l.Products[:min(size, len(l.Products))]
        	w.Header().Set("Content-Type", "application/json")
        	_ = json.NewEncoder(w).Encode(page)
        }
