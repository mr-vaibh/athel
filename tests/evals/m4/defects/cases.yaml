        // Package loyalty awards points when an order is paid.
        package loyalty

        import (
        	"encoding/json"
        	"fmt"
        	"sync"
        )

        // Paid is the orders.paid.v1 message.
        type Paid struct {
        	OrderID    string `json:"order_id"`
        	CustomerID string `json:"customer_id"`
        	Pence      int64  `json:"pence"`
        }

        // Points holds each customer's points balance: one point per whole pound paid.
        type Points struct {
        	mu      sync.Mutex
        	balance map[string]int64
        }

        // NewPoints returns empty balances.
        func NewPoints() *Points { return &Points{balance: map[string]int64{}} }

        // Handle consumes one orders.paid.v1 delivery. The queue delivers at least once and
        // redelivers a message until Handle returns nil.
        func (p *Points) Handle(body []byte) error {
        	var m Paid
        	if err := json.Unmarshal(body, &m); err != nil {
        		return fmt.Errorf("decode orders.paid.v1: %w", err)
        	}
        	if m.OrderID == "" || m.CustomerID == "" || m.Pence < 0 {
        		return fmt.Errorf("orders.paid.v1 %q: order, customer and a non-negative amount are required", m.OrderID)
        	}
        	p.mu.Lock()
        	defer p.mu.Unlock()
        	p.balance[m.CustomerID] += m.Pence / 100
        	return nil
        }

        // Balance returns a customer's points.
        func (p *Points) Balance(customerID string) int64 {
        	p.mu.Lock()
        	defer p.mu.Unlock()
        	return p.balance[customerID]
        }
