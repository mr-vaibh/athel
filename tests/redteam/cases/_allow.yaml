group: allow
cases:
  - {name: read a planned file, tool: Read, input: {file_path: "{tree}/src/phone.go"}, expect: {decision: allow, rule: "12"}}
  - {name: edit a planned file, tool: Edit, input: {file_path: "{tree}/src/phone.go", old_string: a, new_string: b}, expect: {decision: allow, rule: "10"}}
  - {name: create a planned file, tool: Write, input: {file_path: "{tree}/src/validate.go", content: x}, expect: {decision: allow, rule: "10"}}
  - {name: grep the worktree, tool: Grep, input: {pattern: Phone, path: "{tree}"}, expect: {decision: allow, rule: "12"}}
  - {name: glob the worktree, tool: Glob, input: {pattern: "**/*.go", path: "{tree}"}, expect: {decision: allow, rule: "12"}}
  - {name: git status, command: git status, expect: {decision: allow, rule: "12"}}
  - {name: git diff, command: git diff, expect: {decision: allow, rule: "12"}}
  - {name: git log, command: git log --oneline -5, expect: {decision: allow, rule: "12"}}
  - {name: local commit, command: git commit -m "feat(phone) validate", expect: {decision: allow, rule: "10"}}
  - {name: list and grep, command: ls src && grep -rn phone src, expect: {decision: allow, rule: "12"}}
  - {name: echo, command: echo hello, expect: {decision: allow, rule: "12"}}
  - {name: kubectl read on prod, command: kubectl get pods -n users, expect: {decision: allow, rule: "11"}}
  - {name: kubectl logs on staging, command: kubectl --context gke_acme-staging_eu logs deploy/users, expect: {decision: allow, rule: "11"}}
  - {name: gh pr list, command: gh pr list, expect: {decision: allow, rule: "11"}}
  - {name: gcloud run list, command: gcloud run services list, expect: {decision: allow, rule: "11"}}
  - {name: aws describe, command: aws ecs describe-services --cluster c --services users, expect: {decision: allow, rule: "11"}}
  - {name: registered MCP read, tool: mcp__jira__get_issue, input: {issue: X-1}, expect: {decision: allow, rule: "11"}}
  - {name: athel state show, command: athel --json state show CHG-001, expect: {decision: allow, rule: "7x"}}
  - {name: athel checkpoint, command: athel --json checkpoint set CHG-001 build.t1, expect: {decision: allow, rule: "7x"}}
  - {name: env example is not a secret, tool: Read, input: {file_path: "{tree}/.env.example"}, expect: {decision: allow, rule: "12"}}
  - {name: web fetch asks, tool: WebFetch, input: {url: "https://docs.example.com/x", prompt: x}, expect: {decision: approve, rule: "11"}}
  - {name: read outside the workspace asks, tool: Read, input: {file_path: /usr/share/dict/words}, expect: {decision: approve, rule: "12"}}
  - {name: guard mode edit is left to Claude Code, session: guard, tool: Edit, input: {file_path: /somewhere/else/a.go, old_string: a, new_string: b}, expect: {decision: none, rule: "-"}}
  - {name: guard mode unknown command, session: guard, command: npm run build, expect: {decision: none, rule: "-"}}
  - {name: unknown git subcommand (a possible config alias) asks, command: git p origin athel/CHG-001-phone, expect: {decision: approve, rule: "7u"}}
  - {name: read-only git in a developer clone, command: "git -C {home}/Developer/users log -3", expect: {decision: allow, rule: "12"}}
  - {name: read a developer clone, tool: Read, input: {file_path: "{home}/Developer/users/README.md"}, expect: {decision: allow, rule: "12"}}
  - {name: scout records a fact, command: "athel fact add -", agent: athel:scout, expect: {decision: allow, rule: "7x"}}
  - {name: scout queries the fact cache, command: "athel fact find --subject users", agent: athel:scout, expect: {decision: allow, rule: "7x"}}
  - {name: architect reads the open cards, command: "athel --json decide list CHG-001 --open", agent: athel:architect, expect: {decision: allow, rule: "7x"}}
  - {name: architect reads the PRD index, command: "athel --json prd show CHG-001", agent: athel:architect, expect: {decision: allow, rule: "7x"}}
  - {name: architect reads the review template, command: "athel prd review template", agent: athel:architect, expect: {decision: allow, rule: "7x"}}
  - {name: architect reads the blast template, command: "athel blast template", agent: athel:architect, expect: {decision: allow, rule: "7x"}}
  - {name: praxis status, command: praxis status, expect: {decision: allow, rule: "11"}}
  - {name: praxis recalls org memory, command: "praxis memory recall phone number", expect: {decision: allow, rule: "11"}}
  - {name: praxis lists gateway functions, command: praxis mcp, expect: {decision: allow, rule: "11"}}
  - {name: praxis reads duty findings, command: "praxis duty findings nightly", expect: {decision: allow, rule: "11"}}
  - {name: GitHub MCP code search, tool: mcp__github__search_code, input: {query: users.updated.v1}, expect: {decision: allow, rule: "11"}}
  - {name: Grafana Prometheus query, tool: mcp__grafana__query_prometheus, input: {expr: up}, expect: {decision: allow, rule: "11"}}
  - {name: Jira JQL search, tool: mcp__atlassian__searchJiraIssuesUsingJql, input: {jql: "project = SHOP"}, expect: {decision: allow, rule: "11"}}
  - {name: scout saves its answer from a heredoc, command: "athel --json investigation save --ask ASK-001 --summary-text x - <<'EOF'\nschema: athel/investigation@1\nEOF", agent: athel:scout, expect: {decision: allow, rule: "7x"}}
  - {name: scout reads a playbook, command: athel playbook show kubectl, agent: athel:scout, expect: {decision: allow, rule: "7x"}}
