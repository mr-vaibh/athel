# Built-in defaults (layer 1 of 4, doc 02 §Configuration and policy files).
# Org, user and project layers may only tighten these unless a higher layer lists a key under
# `overridable:`. Budgets are per change; at 100% the change is blocked (enforced from a later
# milestone; M0 records and reports only).
schema: athel/config@2
budgets:
  default:
    max_cost_usd: 40
    max_hours: 8
    max_tool_calls: 2000
  warn_ratio: 0.8
locks:
  ttl_min: 30
  heartbeat_min: 5
# M2 Understand (doc 03). Search roots have no default: the developer confirms them (M2 plan Q7).
facts:
  freshness: # minutes before a fact must be re-verified (doc 03 §Freshness classes)
    volatile: 0
    runtime: 60
    topology: 1440
    structural: 10080
    organisational: 10080
  archive_after_days: 90
discovery:
  lookback_hours: 168 # NFR-DISC-04; never less than 24
  question_budget:
    max_tool_calls: 60
    max_minutes: 10
models:
  scout: sonnet # M2 plan Q5
features:
  discovery: false # M2 work in progress; turned on by the PR that ships the scout
