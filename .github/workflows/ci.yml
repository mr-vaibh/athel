name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: test (race) with per-package coverage gate 90%
        run: scripts/coverage-gate.sh 90
      - name: hook latency (p95 < 50 ms over 1,000 spawns)
        run: |
          go build -o bin/athel ./cli/cmd/athel
          go run ./tests/bench/hooklatency -binary bin/athel -n 1000 -max-p95 50ms
      - name: red-team suite (EC-1, EC-2)
        run: go test -count=1 -v -run 'TestRedTeamSuite|TestAllowListSuite|TestCoveragePerGroup' ./tests/redteam/
