# A review round, as the reviewer sends it to `athel review save CHG-NNN T-NN -`.
# The CLI gives new findings their IDs (R<round>-NN) and statuses. Every finding of the last
# round that is not verified or waived must be judged under previous: verified (the fix or the
# developer's dispute is right) or open (still wrong). Only a human waives.
verdict: changes_requested        # approved | changes_requested
previous:
  - {id: R1-02, status: verified, note: the fix maps the parse error to 400 INVOICE_DATE}
  - {id: R1-03, status: open, note: the retry still has no upper bound}
new:
  - severity: major               # blocker | major | minor | nit
    source: reviewer              # reviewer | security | qa | gate
    location: src/billing/total.go:42-58
    rule: errors.no-silent-catch
    finding: The currency lookup error is dropped and the total falls back to 0.
    required: Return a typed CurrencyError and map it to 422 per AC-4.
